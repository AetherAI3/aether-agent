document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g:.06em;margin-left:2px;}\n  .status{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;gap:8px;border:1px solid var(--glass-brd);border-radius:2px;padding:6px 13px;background:rgba(255,255,255,.03);backdrop-filter:blur(10px);}\n  .status .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);}\n\n  .lead{margin:0 4px 18px;}\n  .lead h1{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:-.01em;margin:0 0 5px;}\n  .lead p{color:var(--muted);font-size:13.5px;margin:0;}\n\n  /* ===== bento grid ===== */\n  .bento{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);height:min(620px,calc(100vh - 64px));gap:2px;background:rgba(70,150,195,.5);padding:0;border:2px solid rgba(70,150,195,.5);box-shadow:0 0 34px -16px rgba(40,140,200,.45);}\n  .tile{\n    position:relative;overflow:hidden;display:flex;flex-direction:column;\n    border:none;border-radius:0;padding:22px 22px 20px;\n    background:#04070e;\n    cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1),filter .26s,box-shadow .3s;\n  }\n  .tile::before{content:none;}\n  .tile:hover{transform:scale(1.035);z-index:6;filter:brightness(1.08);box-shadow:0 0 0 2px var(--cyan),0 24px 60px -22px rgba(0,0,0,.92),0 0 56px -12px rgba(0,212,255,.6);}\n  .tile .ico{width:42px;height:42px;border-radius:3px;display:grid;place-items:center;border:1px solid var(--glass-brd);background:rgba(255,255,255,.04);margin-bottom:auto;position:relative;z-index:1;}\n  .tile .ico svg{width:21px;height:21px;}\n  .tile .label{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7f92ad;margin-top:auto;margin-bottom:7px;position:relative;z-index:1;}\n  .t-models .label{margin-top:0;}\n  .tile h2{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0 0 5px;position:relative;z-index:1;color:#11151c;}\n  .tile p{font-family:var(--disp);font-size:13px;font-weight:400;line-height:1.5;color:#5a616e;margin:0;position:relative;z-index:1;max-width:40ch;}\n  .tile .go{display:none;}\n  .tile:hover .go{display:none;}\n  .tile .ext{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:11px;display:flex;align-items:center;gap:6px;position:relative;z-index:1;}\n\n  /* placement (matches wireframe) */\n  .t-back{grid-column:1;grid-row:1;}\n  .t-web{grid-column:2;grid-row:1;--ac:rgba(0,212,255,.16);--ah:rgba(0,212,255,.55);}\n  .t-platform{grid-column:3;grid-row:1;--ac:rgba(54,211,230,.15);--ah:rgba(54,211,230,.5);}\n  .t-models{grid-column:1 / span 2;grid-row:2;--ac:rgba(154,108,255,.16);--ah:rgba(154,108,255,.55);}\n  .t-about{grid-column:3;grid-row:2;--ac:rgba(212,160,23,.14);--ah:rgba(212,160,23,.5);}\n\n  /* back tile */\n  .t-back{cursor:pointer;justify-content:flex-start;overflow:hidden;\n    background:radial-gradient(120% 95% at 28% 30%, #0c1a2e 0%, #070d18 55%, #04070e 100%);border-color:#15263c;}\n  .t-back .stars{position:absolute;inset:0;z-index:0;pointer-events:none;}\n  .t-back .stars i{position:absolute;border-radius:50%;background:#bfe6ff;animation:twk var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);}\n  .t-back .bk{position:relative;z-index:2;}\n  .t-back .bk .label{color:#8fd2ff;margin:0 0 5px;}\n  .t-back .bk h2{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.022em;color:#eaf6ff;margin:0 0 6px;display:flex;align-items:center;gap:13px;text-shadow:0 0 18px rgba(0,185,255,.4);}\n  .t-back .bk .ar{font-size:34px;font-weight:700;line-height:.8;color:var(--cyan);text-shadow:0 0 16px rgba(0,212,255,.8);transition:transform .24s;}\n  .t-back:hover{border-color:rgba(0,212,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.3),0 26px 50px -28px rgba(0,0,0,.6),0 0 40px -16px rgba(0,212,255,.55);}\n  .t-back:hover .bk .ar{transform:translateX(-7px);}\n  .t-back .bk p{font-family:var(--disp);font-size:13px;color:#b9c6da;margin:0;line-height:1.5;}\n  .t-back .go{display:none;}\n\n  .ico.cy{color:var(--cyan);}.ico.cy2{color:var(--cyan-soft);}.ico.vi{color:var(--violet);}.ico.go2{color:var(--gold);}.ico.gr{color:var(--green);}\n\n  /* models tile — overlapping staggered cards, blue blend */\n  .t-models{overflow:hidden;padding:0;background:linear-gradient(180deg,#1b2738,#0e1622);border-color:#203049;}\n  .t-models .mhead{position:absolute;bottom:0;left:0;right:0;z-index:6;padding:40px 22px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;\n    background:linear-gradient(0deg,#060f1b 0%, rgba(6,15,27,.86) 46%, transparent 100%);}\n  .t-models .mhead h2{color:#fff;font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.022em;margin:0;text-shadow:0 2px 16px rgba(0,0,0,.9);}\n  .t-models .mhead .more{flex:none;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--cyan);display:flex;align-items:center;gap:5px;white-space:nowrap;padding-bottom:4px;transition:transform .2s;}\n  .t-models:hover .mhead .more{transform:translateX(3px);}\n  .t-models .go{z-index:7;color:#fff;border-color:rgba(140,210,255,.4);background:rgba(0,180,255,.16);}\n  .t-models:hover .go{transform:translate(2px,-2px);color:#fff;border-color:rgba(140,210,255,.7);background:rgba(0,180,255,.5);}\n  .cards-fan{position:absolute;inset:0;z-index:1;}\n  .cards-fan::after{content:\"\";position:absolute;inset:0;z-index:5;pointer-events:none;\n    background:linear-gradient(180deg, rgba(20,32,52,.30) 0%, rgba(18,30,50,.42) 45%, rgba(13,22,38,.72) 100%),\n      radial-gradient(120% 80% at 50% 38%, rgba(90,150,210,.06), transparent 70%);}\n  .cards-fan .mc{position:absolute;bottom:-40%;aspect-ratio:372/619;border-radius:8px;overflow:hidden;opacity:.92;\n    box-shadow:0 16px 32px -14px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.32);filter:saturate(.72) brightness(.88);\n    transition:transform .34s cubic-bezier(.16,1,.3,1),box-shadow .3s,filter .3s,opacity .3s;}\n  .cards-fan .mc img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;}\n  .cards-fan .mc.k{left:32%;width:37%;bottom:-16%;transform:rotate(0deg);z-index:2;}\n  .cards-fan .mc.p{left:-4%;width:37%;bottom:-18%;transform:rotate(-1.5deg);z-index:4;}\n  .cards-fan .mc.n{right:-4%;width:37%;bottom:-18%;transform:rotate(1.5deg);z-index:3;}\n  .t-models:hover .mc.p{transform:rotate(-3.5deg) translateY(-8px);}\n  .t-models:hover .mc.k{transform:rotate(0deg) translateY(-11px);}\n  .t-models:hover .mc.n{transform:rotate(3.5deg) translateY(-8px);}\n  .t-models:hover .mc{filter:saturate(.85) brightness(.96);opacity:1;}\n\n  /* aether code tile — AETHER wordmark + cloud, blue blend */\n  .t-code{background:radial-gradient(120% 95% at 50% 34%, #0c1a2e 0%, #070d18 55%, #04070e 100%) !important;border-color:#15263c !important;}\n  .t-code .mhead{background:linear-gradient(0deg,#04070e 0%, rgba(4,7,14,.86) 46%, transparent 100%) !important;}\n  .t-code .code-art{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:18px 26px 52px;transition:transform .28s ease;}\n  .t-code .code-art::before{content:\"\";position:absolute;width:78%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.26),transparent 70%);filter:blur(20px);transition:opacity .28s ease;opacity:.8;}\n  .t-code .code-cloud{position:relative;width:78px;height:auto;filter:drop-shadow(0 0 13px rgba(56,189,248,.6)) drop-shadow(0 0 3px rgba(190,238,255,.7));animation:codebob 5.2s ease-in-out infinite;}\n  @keyframes codebob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}\n  .t-code .code-aether{position:relative;margin:0;width:100%;font-family:var(--mono);font-weight:700;line-height:1;font-size:clamp(11px,2.2vw,18px);white-space:pre;user-select:none;text-align:center;\n    background:linear-gradient(96deg,#7defff 0%,#2af2e6 30%,#22d3ee 55%,#38bdf8 78%,#5aa6ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;\n    filter:drop-shadow(0 0 1px rgba(190,250,255,.85)) drop-shadow(0 0 8px rgba(45,214,238,.5)) drop-shadow(0 0 22px rgba(56,189,248,.32));}\n  .t-code:hover .code-art{transform:translateY(-3px);}\n  .t-code:hover .code-art::before{opacity:1;}\n  @media (max-width:560px){ .t-code .code-aether{font-size:11px;} }\n\n  /* web tile — floating cloud in a starfield */\n  .t-web{overflow:hidden;align-items:center;justify-content:center;text-align:center;\n    background:radial-gradient(120% 95% at 50% 30%, #0c1a2e 0%, #070d18 55%, #04070e 100%);border-color:#15263c;}\n  .t-web .go{z-index:5;color:#cfe9ff;border-color:rgba(120,200,255,.32);background:rgba(120,200,255,.1);}\n  .t-web:hover{border-color:rgba(0,212,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.3),0 26px 50px -28px rgba(0,0,0,.6),0 0 40px -16px rgba(0,212,255,.6);}\n  .t-web .stars{position:absolute;inset:0;z-index:0;pointer-events:none;}\n  .t-web .stars i{position:absolute;border-radius:50%;background:#bfe6ff;animation:twk var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);}\n  @keyframes twk{0%,100%{opacity:.15;transform:translateY(0);}50%{opacity:.85;transform:translateY(-5px);}}\n  .t-web .webinner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;}\n  .t-web .cloudwrap{position:relative;display:grid;place-items:center;animation:cloudbob 4.5s ease-in-out infinite;}\n  .t-web .cloudwrap::before{content:\"\";position:absolute;width:138px;height:138px;border-radius:50%;\n    background:radial-gradient(circle,rgba(0,185,255,.55),rgba(0,185,255,0) 68%);}\n  .t-web .cloud{position:relative;width:90px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 8px 18px rgba(0,180,255,.6));}\n  @keyframes cloudbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}\n  .t-web .weblabel{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.022em;line-height:1.24;whi
