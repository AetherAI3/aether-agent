<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #03101a;
    --bg-2: #02161d;
    --panel: rgba(8, 28, 38, 0.72);
    --panel-2: rgba(6, 22, 30, 0.85);
    --line: rgba(45, 212, 238, 0.16);
    --line-strong: rgba(45, 212, 238, 0.34);
    --cyan: #22d3ee;
    --cyan-bright: #38e6f0;
    --sky: #38bdf8;
    --blue: #4ea8ff;
    --green: #34d399;
    --amber: #fbbf24;
    --text: #d2ecf3;
    --muted: #6f93a0;
    --muted-dim: #4a6873;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Sora', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 24px 72px;
    background:
      radial-gradient(1100px 620px at 50% -8%, rgba(34, 211, 238, 0.10), transparent 60%),
      radial-gradient(900px 560px at 88% 12%, rgba(78, 168, 255, 0.07), transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 60%);
  }

  ::selection { background: rgba(34, 211, 238, 0.28); color: #eafcff; }

  #root { width: 100%; max-width: 1080px; }

  /* faint grid texture */
  .grid-tex {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(34, 211, 238, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(1200px 700px at 50% 0%, #000 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(1200px 700px at 50% 0%, #000 30%, transparent 78%);
    z-index: 0;
  }

  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { to { opacity: 0; } }

  @media (max-width: 720px) {
    body { padding: 24px 12px 48px; }
  }
  @media (max-width: 640px) {
    .card-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 760px) {
    .models-grid { grid-template-columns: 1fr !important; }
  }
  .gh-bar:hover {
    border-color: var(--line-strong) !important;
    background: rgba(34,211,238,0.07) !important;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#03101a"/>
      <g fill="#22d3ee">
        <rect x="40" y="30" width="20" height="6"/>
        <rect x="33" y="36" width="34" height="6"/>
        <rect x="28" y="42" width="44" height="6"/>
        <rect x="28" y="48" width="44" height="6"/>
        <rect x="33" y="54" width="10" height="5"/>
        <rect x="57" y="54" width="10" height="5"/>
      </g>
      <text x="50" y="74" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">AETHER</text>
    </svg>
  </template>
  <div class="grid-tex"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="parts.jsx"></script>
  <script src="cloud_frames.js"></script>
  <script type="text/babel" src="models.jsx"></script>
  <script type="text/babel" src="commands.jsx"></script>
  <script type="text/babel" src="card.jsx"></script>
</body>
</html>
