name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

# Same-repo PR branches fire both on.push and on.pull_request for the same
# commit, running build-and-test twice. Cancel the superseded run instead of
# paying for (and status-checking) both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json's test script uses `node --test --test-isolation=none`,
          # which Node 20 doesn't support ("bad option") — match engines.node.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
