name: CI

on:
  push:
    branches:
      - main
      - release/0.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json's test script uses `node --test --test-isolation=none`,
          # which Node 20 doesn't support ("bad option") — match engines.node.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      # Emit the compact, machine-readable package summary on both release
      # platforms. The release-coherence suite binds the packet's named host
      # measurement to this same npm pack result, so a value from one runner
      # cannot be relabelled as evidence from the other.
      - name: Emit exact-head production package report
        run: npm run verify:production

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify production package and policy
        run: npm run verify:production

      - name: Verify live release truth
        run: npm run release:truth

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > aether-agents.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-agents-sbom-${{ github.sha }}
          path: aether-agents.cdx.json
          if-no-files-found: error
          retention-days: 90
